name: Publish BOMING Air blog

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Generate today's article
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python generate.py
      - name: Commit new content
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "boming-bot"
          git config user.email "bot@bomingair.com"
          git add posts.json site
          git commit -m "auto: new post $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main || git rebase --abort || true
          git push || echo "push skipped"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
